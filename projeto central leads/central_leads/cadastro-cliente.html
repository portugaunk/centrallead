<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilo.css?v=13">
<script>try{var t=localStorage.getItem("cl_tema");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="icon" href="img/favicon.png" type="image/png">
<title>Criar conta — Portal do Cliente</title>
</head>
<body data-pagina="cliente-cadastro">

<div id="tela-carregando" class="carregando">Abrindo o portal…</div>

<div id="tela-conteudo" class="acesso oculto">
  <aside class="acesso-lado"><div class="lado-marca"><img class="logo-vertice" src="img/logo-vertice.png" alt="Vértice" height="46"></div><div><h2>Seu próximo endereço começa aqui.</h2><p>Plantas, preços e prazos dos empreendimentos, reunidos para você comparar.</p></div></aside>
  <form class="cartao-acesso" id="form-cadastro-cliente">
    <div class="marca"><svg class="simbolo" viewBox="0 0 64 64" aria-hidden="true"><path class="p" d="M52 52V12H12v40h16"/><path class="a" d="M28 52V28a24 24 0 0 1 24 24"/></svg><b>Portal do Cliente</b></div>
    <p class="sub" style="margin-bottom:14px">Crie sua conta para navegar pelos empreendimentos disponíveis.</p>
    <div id="erro-cadastro-cliente"></div>
    <div class="campo"><label for="pc-nome">Nome</label>
      <input id="pc-nome" required maxlength="120" autocomplete="name" autofocus></div>
    <div class="campo"><label for="pc-email">E-mail</label>
      <input id="pc-email" type="email" required autocomplete="username"></div>
    <div class="campo"><label for="pc-telefone">Telefone / WhatsApp com DDD (opcional)</label>
      <input id="pc-telefone" type="tel" maxlength="20" autocomplete="tel" placeholder="(11) 98888-7777"></div>
    <div class="campo"><label for="pc-senha">Senha</label>
      <div class="campo-senha">
        <input id="pc-senha" type="password" required minlength="8" autocomplete="new-password">
        <button type="button" class="mostrar-senha" data-alvo="pc-senha" aria-label="Mostrar ou ocultar a senha">Mostrar</button>
      </div></div>
    <div class="campo"><label for="pc-senha2">Confirme a senha</label>
      <div class="campo-senha">
        <input id="pc-senha2" type="password" required minlength="8" autocomplete="new-password">
        <button type="button" class="mostrar-senha" data-alvo="pc-senha2" aria-label="Mostrar ou ocultar a senha">Mostrar</button>
      </div></div>
    <button class="btn btn-primario btn-cheio" type="submit" id="btn-cadastrar-cliente">Criar conta</button>
    <p class="aviso">Já tem conta? <a href="entrar-cliente.html">Entrar</a>.</p>
  </form>
</div>

<script src="js/dados.js?v=3"></script>
<script src="js/portal.js?v=2"></script>
<script src="js/particulas.js"></script>
</body>
</html>
