<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilo.css?v=13">
<script>try{var t=localStorage.getItem("cl_tema");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="icon" href="img/favicon.png" type="image/png">
<title>Entrar — Portal do Cliente</title>
</head>
<body data-pagina="cliente-login">

<div id="tela-carregando" class="carregando">Abrindo o portal…</div>

<div id="tela-conteudo" class="acesso oculto">
  <aside class="acesso-lado"><div class="lado-marca"><img class="logo-vertice" src="img/logo-vertice.png" alt="Vértice" height="46"></div><div><h2>Seu próximo endereço começa aqui.</h2><p>Plantas, preços e prazos dos empreendimentos, reunidos para você comparar.</p></div></aside>
  <form class="cartao-acesso" id="form-login-cliente">
    <div class="marca"><svg class="simbolo" viewBox="0 0 64 64" aria-hidden="true"><path class="p" d="M52 52V12H12v40h16"/><path class="a" d="M28 52V28a24 24 0 0 1 24 24"/></svg><b>Portal do Cliente</b></div>
    <div id="erro-login-cliente"></div>
    <div class="campo"><label for="pl-email">E-mail</label>
      <input id="pl-email" type="email" required autocomplete="username" autofocus></div>
    <div class="campo"><label for="pl-senha">Senha</label>
      <div class="campo-senha">
        <input id="pl-senha" type="password" required autocomplete="current-password">
        <button type="button" class="mostrar-senha" data-alvo="pl-senha" aria-label="Mostrar ou ocultar a senha">Mostrar</button>
      </div></div>
    <button class="btn btn-primario btn-cheio" type="submit" id="btn-entrar-cliente">Entrar</button>
    <p class="aviso">Ainda não tem conta? <a href="cadastro-cliente.html">Cadastre-se</a>.<br>É da equipe? <a href="login.html">Entre por aqui</a>.</p>
  </form>
</div>

<script src="js/dados.js?v=3"></script>
<script src="js/portal.js?v=2"></script>
<script src="js/particulas.js"></script>
</body>
</html>
